<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f3f6fc" />
  <meta name="description" content="SwitchLAN Studio：局域网共享、账户和权限控制台。展示 Windows 实际账户、共享及 SMB 直接权限，支持安全的管理与保存后验证。" />
  <title>SwitchLAN Studio Core 1.4.5 · Windows 文件共享与账户管理</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="editorDialog" aria-label="编辑器"></dialog>
  <input type="file" id="snapshotFile" hidden accept=".json,application/json" />
  <script>
    // Diagnostic-only crash relay. No account names, tokens or payloads are sent.
    window.addEventListener('error', function(e) {
      try { window.chrome?.webview?.postMessage({type:'ui-error',message:String(e.message||'Script failed').slice(0,200)}); } catch (_) {}
    });
    window.addEventListener('unhandledrejection', function(e) {
      try { window.chrome?.webview?.postMessage({type:'ui-error',message:String(e.reason?.message||'Unhandled JS rejection').slice(0,200)}); } catch (_) {}
    });
  </script>
  <script src="js/knowledge.js"></script>
  <script src="js/policy.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/liquid-fusion.js"></script>
</body>
</html>

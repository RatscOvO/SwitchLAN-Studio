<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f3f6fc" />
  <meta name="description" content="SwitchLAN Studio: a Windows desktop console for local accounts, SMB file shares, permission inspection, LAN discovery and multiplayer diagnostics." />
  <title>SwitchLAN Studio 1.4.5 English · Windows LAN &amp; File Sharing</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="editorDialog" aria-label="Editor"></dialog>
  <input type="file" id="snapshotFile" hidden accept=".json,application/json" />
  <script>
    // Diagnostic-only crash relay. No account names, tokens or payloads are sent.
    window.addEventListener('error', function(e) {
      try { window.chrome?.webview?.postMessage({type:'ui-error',message:String(e.message||'Script failed').slice(0,200)}); } catch (_) {}
    });
    window.addEventListener('unhandledrejection', function(e) {
      try { window.chrome?.webview?.postMessage({type:'ui-error',message:String(e.reason?.message||'Unhandled JS rejection').slice(0,200)}); } catch (_) {}
    });
  </script>
  <script src="js/knowledge.js"></script>
  <script src="js/policy.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/liquid-fusion.js"></script>
</body>
</html>

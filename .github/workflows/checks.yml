name: Windows build and source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: JavaScript syntax and policy checks
        shell: pwsh
        run: |
          Get-ChildItem js -Filter '*.js' | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          node tests/test-policy.js
      - name: Static contracts
        run: |
          python -X utf8 tests/test-core14-static.py
          python -X utf8 tests/test-core131-static.py
      - name: PowerShell 5.1 encoding and parser checks
        shell: powershell
        run: ./tests/Check-PowerShellScripts.ps1
      - name: Build desktop application
        run: dotnet build desktop/SwitchLAN.Desktop/SwitchLAN.Desktop.csproj -c Release --nologo
